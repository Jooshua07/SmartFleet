{% extends 'base.html' %}
{% block content %}<div class="page-title"><h1>{{ title }}</h1></div>{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="edit-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="command_token" value="{{ command_token }}"><label for="reason">Correction reason</label><input id="reason" name="reason" maxlength="500" required value="{{ request.form.get('reason','') }}"><label class="check-label"><input type="checkbox" name="confirm" required>Confirm {{ 'reversal' if reversal else 'deletion' }} of record {{ request.view_args.record_id }}</label><button type="submit" class="primary"><i data-lucide="{{ 'undo-2' if reversal else 'trash-2' }}" aria-hidden="true"></i>{{ 'Reverse' if reversal else 'Delete' }}</button><a href="/finance" class="button secondary">Cancel</a></form>{% endblock %}
