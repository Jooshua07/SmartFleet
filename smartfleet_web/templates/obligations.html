{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Unpaid obligations</h1></div>{% for row in rows %}<article class="register-row"><h2>{{ row.registration_number }} | {{ row.responsible_party_name }}</h2><p>{{ row.recognized_date }} | Outstanding K {{ row.outstanding_amount }}</p><a class="record-link" href="{{ url_for('recording.payment',record_id=row.id) }}">Payments<i data-lucide="chevron-right" aria-hidden="true"></i></a></article>{% else %}<p class="empty-state">No unpaid obligations.</p>{% endfor %}{% endblock %}
