[tool.ruff]
target-version = "py312"
line-length = 100
include = ["smartfleet_web/**/*.py", "tests/web/**/*.py", "tests/integration/**/*.py", "scripts/setup_flask_dev.py", "scripts/setup_flask_stage2.py", "scripts/setup_flask_stage3.py", "scripts/setup_flask_stage5.py", "scripts/run_flask_dev.py", "services/collection_schedule_service.py", "services/bus_account_detail_service.py", "wsgi.py", "database/connection.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"scripts/setup_flask_dev.py" = ["S603"]

[tool.pytest.ini_options]
markers = ["integration: requires the explicitly isolated local PostgreSQL test database", "browser: real Chromium interaction against an isolated local Flask server"]
testpaths = ["tests/web", "tests/integration"]
